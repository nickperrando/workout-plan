<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Iron Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<meta name="theme-color" content="#15171B">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2315171B'/%3E%3Crect x='14' y='44' width='72' height='12' rx='3' fill='%23C9A15A'/%3E%3Crect x='8' y='34' width='10' height='32' rx='2' fill='%23C9A15A'/%3E%3Crect x='82' y='34' width='10' height='32' rx='2' fill='%23C9A15A'/%3E%3C/svg%3E">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#15171B;
    --surface:#1E2126;
    --surface-2:#262A31;
    --surface-3:#2E333B;
    --line:#33383F;
    --text:#EDEEF0;
    --text-dim:#9AA0AA;
    --text-faint:#666C76;
    --accent:#C9A15A;
    --accent-dim:#8A733F;
    --accent-2:#5B85A6;
    --good:#6E8B74;
    --warn:#B7794B;
    --font-display:'Futura','Trebuchet MS',system-ui,sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
    --font-mono:'SF Mono',ui-monospace,'Menlo',monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
    overscroll-behavior-y:none; -webkit-user-select:none; user-select:none;
  }
  input, textarea{ -webkit-user-select:text; user-select:text; }
  #app{
    max-width:560px; margin:0 auto; min-height:100vh;
    display:flex; flex-direction:column;
    padding-bottom:calc(64px + env(safe-area-inset-bottom));
  }
  header.top{
    padding:calc(18px + env(safe-area-inset-top)) 20px 14px;
    background:linear-gradient(180deg,var(--surface) 0%, var(--bg) 100%);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:5;
  }
  header.top h1{
    font-family:var(--font-display); font-weight:700; letter-spacing:2.5px;
    text-transform:uppercase; font-size:20px; margin:0; color:var(--text);
  }
  header.top h1 span{ color:var(--accent); }
  header.top .sub{ color:var(--text-dim); font-size:12.5px; margin-top:3px; font-family:var(--font-mono); letter-spacing:.3px; }

  main{ flex:1; padding:16px 16px 24px; }
  .view{ display:none; animation:fade .18s ease; }
  .view.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  .section-label{
    font-family:var(--font-display); text-transform:uppercase; letter-spacing:2px;
    font-size:12px; color:var(--text-faint); margin:22px 2px 10px; font-weight:700;
  }
  .section-label:first-child{ margin-top:2px; }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; margin-bottom:10px;
  }
  .card.pressable:active{ background:var(--surface-2); }

  .prog-grid{ display:flex; flex-direction:column; gap:10px; }
  .prog-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:16px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .prog-card .name{ font-weight:600; font-size:16px; }
  .prog-card .meta{ color:var(--text-dim); font-size:12.5px; margin-top:2px; }
  .variant-row{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .chip{
    background:var(--surface-2); border:1px solid var(--line); color:var(--text-dim);
    padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer;
    font-family:var(--font-body);
  }
  .chip.active{ background:var(--accent); border-color:var(--accent); color:#1A1C20; }
  .chip:active{ opacity:.8; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--accent); color:#1A1C20; border:none; border-radius:12px;
    padding:14px 18px; font-weight:700; font-size:15px; width:100%; cursor:pointer;
    font-family:var(--font-body); letter-spacing:.2px;
  }
  .btn:active{ background:var(--accent-dim); }
  .btn.ghost{
    background:transparent; border:1px solid var(--line); color:var(--text);
  }
  .btn.ghost:active{ background:var(--surface-2); }
  .btn.small{ padding:9px 14px; font-size:13px; width:auto; }
  .btn.danger{ background:transparent; border:1px solid #6E3D34; color:#C97A64; }

  .ex-row{
    display:flex; gap:12px; align-items:flex-start; padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .ex-row:last-child{ border-bottom:none; }
  .ex-icon-wrap{
    width:44px; height:44px; border-radius:10px; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--accent);
  }
  .ex-icon-wrap svg{ width:28px; height:28px; }
  .ex-info{ flex:1; min-width:0; }
  .ex-name{ font-weight:600; font-size:15px; }
  .ex-prescribed{ color:var(--text-dim); font-size:12.5px; margin-top:2px; font-family:var(--font-mono); }
  .set-dots{ display:flex; gap:6px; margin-top:10px; }
  .set-dot{
    width:26px; height:26px; border-radius:8px; border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:11px;
    font-family:var(--font-mono); color:var(--text-faint); cursor:pointer;
  }
  .set-dot.done{ background:var(--accent); border-color:var(--accent); color:#1A1C20; font-weight:700; }

  .field-row{ display:flex; gap:8px; margin-top:8px; }
  .field{ flex:1; }
  .field label{ display:block; font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; }
  .field input, .field select{
    width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:9px 10px; font-size:14px; font-family:var(--font-mono);
  }
  .field input:focus, .field select:focus{ outline:1.5px solid var(--accent); }

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:10;
    background:rgba(21,23,27,.94); backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabbar .row{
    max-width:560px; margin:0 auto; display:flex;
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color:var(--text-faint);
    padding:10px 4px 8px; font-family:var(--font-body); font-size:10.5px;
    display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;
    letter-spacing:.3px;
  }
  nav.tabbar button svg{ width:22px; height:22px; }
  nav.tabbar button.active{ color:var(--accent); }

  .empty{
    text-align:center; padding:40px 20px; color:var(--text-faint);
  }
  .empty svg{ width:40px; height:40px; margin-bottom:10px; opacity:.5; }
  .empty p{ font-size:13.5px; line-height:1.5; }

  .hist-item{ padding:13px 0; border-bottom:1px solid var(--line); }
  .hist-item:last-child{ border-bottom:none; }
  .hist-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .hist-date{ font-weight:600; font-size:14.5px; }
  .hist-prog{ color:var(--accent); font-size:12px; font-family:var(--font-mono); }
  .hist-detail{ margin-top:8px; font-size:12.5px; color:var(--text-dim); line-height:1.6; display:none; }
  .hist-item.open .hist-detail{ display:block; }

  .lib-cat{ margin-bottom:4px; }
  .search-bar{
    background:var(--surface-2); border:1px solid var(--line); border-radius:12px;
    padding:11px 14px; width:100%; color:var(--text); font-size:14.5px; font-family:var(--font-body);
    margin-bottom:14px;
  }
  .filter-row{ display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:6px; }
  .filter-row::-webkit-scrollbar{ display:none; }

  .lib-row{
    display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .lib-row:last-child{ border-bottom:none; }
  .lib-name{ font-weight:600; font-size:14.5px; }
  .lib-muscles{ color:var(--text-dim); font-size:12px; margin-top:1px; }
  .lib-detail{
    display:none; padding:0 0 14px 56px; margin-top:-6px; color:var(--text-dim); font-size:13px; line-height:1.6;
  }
  .lib-row-wrap.open .lib-detail{ display:block; }
  .lib-row-wrap.open .ex-icon-wrap{ color:var(--accent-2); }

  .manage-list .ex-row{ align-items:center; }
  .icon-x{ color:var(--text-faint); }

  .sparkline-wrap{ margin-top:6px; }

  textarea.jsonbox{
    width:100%; height:110px; background:var(--surface-2); border:1px solid var(--line);
    color:var(--text); border-radius:8px; padding:10px; font-family:var(--font-mono); font-size:11.5px;
  }
  .toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
    background:var(--surface-3); border:1px solid var(--line); color:var(--text);
    padding:10px 18px; border-radius:999px; font-size:13px; z-index:50; opacity:0;
    transition:opacity .2s, transform .2s; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  select.plain{
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:8px 10px; font-family:var(--font-body); font-size:13px;
  }
  .modal-bg{
    position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:30; display:none;
    align-items:flex-end; justify-content:center;
  }
  .modal-bg.show{ display:flex; }
  .modal{
    background:var(--surface); border-radius:18px 18px 0 0; padding:20px 18px calc(24px + env(safe-area-inset-bottom));
    width:100%; max-width:560px; max-height:82vh; overflow-y:auto;
  }
  .modal h3{ font-family:var(--font-display); text-transform:uppercase; letter-spacing:1.5px; font-size:15px; margin:0 0 14px; }
  .modal .close-x{ float:right; color:var(--text-faint); font-size:20px; cursor:pointer; }

  /* ---- auth gate ---- */
  #auth-gate{
    position:fixed; inset:0; z-index:100; background:var(--bg);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .auth-box{ width:100%; max-width:340px; }
  .auth-box h1{
    font-family:var(--font-display); text-transform:uppercase; letter-spacing:2.5px;
    font-size:22px; text-align:center; margin:0 0 4px;
  }
  .auth-box h1 span{ color:var(--accent); }
  .auth-box .tagline{ text-align:center; color:var(--text-dim); font-size:12.5px; margin-bottom:26px; }
  .auth-box .field{ margin-bottom:12px; }
  .auth-box .field input{
    width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:12px 14px; font-size:15px; font-family:var(--font-body);
  }
  .auth-box .field input:focus{ outline:1.5px solid var(--accent); }
  .auth-toggle{ text-align:center; margin-top:16px; color:var(--text-dim); font-size:13px; }
  .auth-toggle a{ color:var(--accent); text-decoration:none; font-weight:600; cursor:pointer; }
  .auth-error{ color:#C97A64; font-size:12.5px; text-align:center; margin-top:10px; min-height:16px; }
  .auth-skip{ text-align:center; margin-top:22px; }
  .auth-skip a{ color:var(--text-faint); font-size:12px; text-decoration:underline; cursor:pointer; }

  .sync-badge{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-family:var(--font-mono);
    color:var(--text-faint); margin-top:3px; cursor:pointer; text-decoration:underline; text-decoration-style:dotted;
  }
  .sync-badge .dot{ width:6px; height:6px; border-radius:50%; background:var(--text-faint); }
  .sync-badge.online .dot{ background:var(--good); }
  .sync-badge.offline .dot{ background:var(--warn); }
</style>
</head>
<body>

<div id="auth-gate">
  <div class="auth-box">
    <h1>IRON <span>LOG</span></h1>
    <div class="tagline">Sign in to sync your workouts across devices</div>
    <div class="field"><input id="auth-email" type="email" autocomplete="email" placeholder="Email" inputmode="email"></div>
    <div class="field"><input id="auth-password" type="password" autocomplete="current-password" placeholder="Password"></div>
    <button class="btn" id="auth-submit-btn">Log In</button>
    <div class="auth-error" id="auth-error"></div>
    <div class="auth-toggle">
      <span id="auth-toggle-prompt">Don't have an account?</span> <a id="auth-toggle-link">Sign up</a>
    </div>
    <div class="auth-skip"><a id="auth-skip-link">Skip for now — use this device only ›</a></div>
  </div>
</div>

function debugLog(msg){

  DEBUG_LOG.push(line);
  if(DEBUG_LOG.length > 80) DEBUG_LOG.shift();
  console.log('[IronLog]', msg);
}
window.addEventListener('error', e=> debugLog('JS ERROR: ' + e.message + ' (' + (e.filename||'') + ':' + (e.lineno||'') + ')'));
window.addEventListener('unhandledrejection', e=> debugLog('PROMISE REJECTED: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));

function openDebugLog(){
  const body = DEBUG_LOG.length
    ? DEBUG_LOG.map(l=>l.replace(/</g,'&lt;')).join('\n')
    : '(empty — nothing logged yet)';
  openModal(`
    <span class="close-x" id="modal-close">✕</span>
    <h3>Sync Debug Log</h3>
    <textarea class="jsonbox" style="height:280px; font-size:11px;" readonly>${body}</textarea>
    <button class="btn ghost" id="debug-copy-btn" style="margin-top:10px">Copy Log</button>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('debug-copy-btn').addEventListener('click', ()=>{
    const ta = document.querySelector('#modal-body textarea');
    ta.select();
    try{ document.execCommand('copy'); toast('Copied'); }
    catch(e){ if(navigator.clipboard) navigator.clipboard.writeText(ta.value).then(()=>toast('Copied')); }
  });
}
document.getElementById('sync-badge').addEventListener('click', openDebugLog);
document.getElementById('sync-badge').style.cursor = 'pointer';

function hideAuthGate(){ document.getElementById('auth-gate').style.display = 'none'; }
function showAuthGate(){ document.getElementById('auth-gate').style.display = 'flex'; }

function setAuthButtonConnecting(){
  const btn = document.getElementById('auth-submit-btn');
  btn.disabled = true;
  btn.dataset.label = btn.dataset.label || btn.textContent; // remember what it should say once ready
  btn.textContent = 'Connecting…';
}
function setAuthButtonReady(){
  const btn = document.getElementById('auth-submit-btn');
  btn.disabled = false;
  btn.textContent = btn.dataset.label || (AUTH_MODE === 'login' ? 'Log In' : 'Sign Up');
}

function initFirebase(attempt){
  attempt = attempt || 1;
  debugLog('initFirebase() attempt ' + attempt + ' — typeof firebase = ' + typeof firebase);
  // If the user already chose to skip sign-in, never block the app on load —
  // it'll only reappear if they explicitly tap "Sign In / Sync" from Manage.
  if(authSkipped()) hideAuthGate();
  setAuthButtonConnecting();
  try{
    if(typeof firebase === 'undefined'){
      if(attempt <= 4){
        // SDK script may still be loading (slow connection, or a content blocker delaying it) — retry with backoff
        debugLog('Firebase SDK not present yet, retrying in ' + (attempt*1500) + 'ms');
        setTimeout(()=> initFirebase(attempt+1), attempt * 1500);
        throw new Error('Firebase SDK not loaded yet — retrying (attempt ' + attempt + ')');
      }
      FIREBASE_INIT_ERROR = "The Firebase library never loaded from gstatic.com. This is usually a content blocker, ad blocker, or restricted network blocking that domain — check Safari's Content Blockers / Extensions, or try a different network.";
      debugLog('GAVE UP after 4 attempts: firebase SDK script never became available.');
      throw new Error(FIREBASE_INIT_ERROR);
    }
    if(firebaseConfig.apiKey.startsWith('PASTE_')){
      FIREBASE_INIT_ERROR = "This copy of the app still has placeholder Firebase config values.";
      debugLog('firebaseConfig.apiKey is still a placeholder.');
      setSyncBadge(null, 'Cloud sync not configured');
      hideAuthGate();
      return;
    }
    debugLog('Firebase SDK present. Calling initializeApp()...');
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    FIREBASE_READY = true;
    FIREBASE_INIT_ERROR = null;
    debugLog('initializeApp() succeeded. Waiting on auth state...');
    setAuthButtonReady();
    firebase.auth().onAuthStateChanged(user=>{
      if(user){
        debugLog('onAuthStateChanged: signed in as ' + user.email + ' (uid ' + user.uid + ')');
        CURRENT_USER = user;
        localStorage.removeItem(LS_AUTH_SKIPPED);
        hideAuthGate();
        CLOUD_REF = firebase.database().ref('users/' + user.uid + '/data');
        setSyncBadge('online', user.email);
        pullFromCloudThenListen();
      } else {
        debugLog('onAuthStateChanged: no user signed in');
        CURRENT_USER = null;
        CLOUD_REF = null;
        setSyncBadge(null, 'Local only');
        if(!authSkipped()) showAuthGate(); else hideAuthGate();
      }
    }, err=>{
      debugLog('onAuthStateChanged ERROR: ' + err.message);
    });
    window.addEventListener('online', ()=>{ if(CURRENT_USER) setSyncBadge('online', CURRENT_USER.email); });
    window.addEventListener('offline', ()=>{ if(CURRENT_USER) setSyncBadge('offline', 'Offline — will sync later'); });
  }catch(e){
    console.warn('Cloud sync unavailable:', e);
    debugLog('initFirebase() caught: ' + e.message);
    setSyncBadge(null, 'Local only');
    if(!authSkipped()) hideAuthGate(); // never block the app just because the SDK hasn't loaded
    if(FIREBASE_INIT_ERROR){
      setAuthButtonReady(); // stop showing "Connecting…" — let them see the real error if they try
      const errEl = document.getElementById('auth-error');
      if(errEl) errEl.textContent = FIREBASE_INIT_ERROR;
    }
  }
}

function pullFromCloudThenListen(){
  debugLog('Pulling initial data from cloud...');
  CLOUD_REF.get().then(snap=>{
    const remote = snap.val();
    if(remote){
      debugLog('Cloud data found, applying it locally.');
      applyRemoteData(remote);
    } else {
      debugLog('No cloud data yet for this account — pushing local data up.');
      syncToCloud(); // first login on this account — seed the cloud with local data
    }
    CLOUD_REF.on('value', snap2=>{
      const remote2 = snap2.val();
      if(!remote2 || SUPPRESS_SYNC) return;
      debugLog('Received a remote update from another device.');
      applyRemoteData(remote2);
    });
  }).catch(err=>{
    console.warn('Cloud pull failed (offline?):', err);
    debugLog('Cloud pull FAILED: ' + err.message + ' (code: ' + (err.code||'?') + ')');
    setSyncBadge('offline', 'Offline — using local data');
  });
}

function applyRemoteData(remote){
  SUPPRESS_SYNC = true;
  if(remote.programs) PROGRAMS = remote.programs;
  if(remote.history) HISTORY = remote.history;
  if(remote.customLibrary) CUSTOM_LIBRARY = remote.customLibrary;
  localStorage.setItem(LS_PROGRAMS, JSON.stringify(PROGRAMS));
  localStorage.setItem(LS_HISTORY, JSON.stringify(HISTORY));
  localStorage.setItem(LS_LIBRARY, JSON.stringify(CUSTOM_LIBRARY));
  SUPPRESS_SYNC = false;
  showTab(CURRENT_TAB);
}

function syncToCloud(){
  if(!CURRENT_USER || !CLOUD_REF || SUPPRESS_SYNC) return;
  CLOUD_REF.set({ programs: PROGRAMS, history: HISTORY, customLibrary: CUSTOM_LIBRARY, updatedAt: Date.now() })
    .then(()=> setSyncBadge('online', CURRENT_USER.email))
    .catch(err=>{
      console.warn('Sync failed (offline?):', err);
      setSyncBadge('offline', 'Offline — will sync later');
    });
}

function signOutCloud(){
  if(FIREBASE_READY && firebase.auth().currentUser){
    firebase.auth().signOut();
  }
  toast('Signed out');
}

/* ---- auth gate wiring ---- */
document.getElementById('auth-toggle-link').addEventListener('click', ()=>{
  AUTH_MODE = AUTH_MODE === 'login' ? 'signup' : 'login';
  const btn = document.getElementById('auth-submit-btn');
  const label = AUTH_MODE === 'login' ? 'Log In' : 'Sign Up';
  btn.dataset.label = label;
  if(!btn.disabled) btn.textContent = label; // don't clobber "Connecting…" if still waiting on Firebase
  document.getElementById('auth-toggle-prompt').textContent = AUTH_MODE === 'login' ? "Don't have an account?" : 'Already have an account?';
  document.getElementById('auth-toggle-link').textContent = AUTH_MODE === 'login' ? 'Sign up' : 'Log in';
  document.getElementById('auth-error').textContent = '';
});
document.getElementById('auth-submit-btn').addEventListener('click', ()=>{
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.textContent = '';
  if(!FIREBASE_READY){ errEl.textContent = FIREBASE_INIT_ERROR || 'Cloud sync isn\'t ready yet — try again in a moment.'; return; }
  if(!email || !password){ errEl.textContent = 'Enter an email and password.'; return; }
  const action = AUTH_MODE === 'login'
    ? firebase.auth().signInWithEmailAndPassword(email, password)
    : firebase.auth().createUserWithEmailAndPassword(email, password);
  action.catch(err=>{ errEl.textContent = err.message.replace(/^Firebase:\s*/,''); });
});
document.getElementById('auth-skip-link').addEventListener('click', ()=>{
  localStorage.setItem(LS_AUTH_SKIPPED, '1');
  hideAuthGate();
});

/* ============================= HELPERS ============================= */

function iconSvg(pattern, size){
  size = size || 28;
  const id = "ic-" + (pattern || "bodyweight");
  return `<svg viewBox="0 0 48 48" width="${size}" height="${size}"><use href="#${id}"/></svg>`;
}
function fmtWeight(w){ return (w===null || w===undefined) ? "BW" : (w % 1 === 0 ? w : w.toFixed(1)) + " lb"; }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{ weekday:'short', month:'short', day:'numeric' });
}
function todayStr(){
  const d = new Date();
  return d.toLocaleDateString(undefined,{ weekday:'long', month:'long', day:'numeric' });
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 1800);
}
function openModal(html){
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-bg').classList.add('show');
}
function closeModal(){ document.getElementById('modal-bg').classList.remove('show'); }
document.getElementById('modal-bg').addEventListener('click', e=>{ if(e.target.id==='modal-bg') closeModal(); });

/* ============================= TABS ============================= */

const TABS = ['today','history','library','manage'];
let CURRENT_TAB = 'today';
function showTab(name){
  CURRENT_TAB = name;
  TABS.forEach(t=>{
    document.getElementById('view-'+t).classList.toggle('active', t===name);
  });
  document.querySelectorAll('nav.tabbar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===name);
  });
  if(name==='today') renderToday();
  if(name==='history') renderHistory();
  if(name==='library') renderLibrary();
  if(name==='manage') renderManage();
}
document.querySelectorAll('nav.tabbar button').forEach(b=>{
  b.addEventListener('click', ()=> showTab(b.dataset.tab));
});

/* ============================= TODAY VIEW ============================= */

let SELECTED_PROG = Object.keys(PROGRAMS).sort((a,b)=>PROGRAMS[a].order-PROGRAMS[b].order)[0];
let SELECTED_VARIANT = 'main';

function renderToday(){
  document.getElementById('header-sub').textContent = todayStr();
  const view = document.getElementById('view-today');

  if(ACTIVE_SESSION){
    view.innerHTML = renderActiveSession();
    bindActiveSessionEvents();
    return;
  }

  const progKeys = Object.keys(PROGRAMS).sort((a,b)=>PROGRAMS[a].order-PROGRAMS[b].order);
  let html = `<div class="section-label">Choose a program</div><div class="prog-grid">`;
  progKeys.forEach(pk=>{
    const prog = PROGRAMS[pk];
    const variantKeys = Object.keys(prog.variants);
    const isSel = pk === SELECTED_PROG;
    html += `<div class="prog-card" data-prog="${pk}">
      <div style="flex:1">
        <div class="name">${prog.label}</div>
        <div class="meta">${getVariant(prog, isSel?SELECTED_VARIANT:'main').exercises.length || 0} exercises · ${prog.variants.main.exercises.length ? prog.variants.main.exercises.length+' set groups' : ''}</div>
        ${isSel ? `<div class="variant-row">` + variantKeys.map(vk=>{
          const empty = getVariant(prog, vk).exercises.length===0;
          return `<span class="chip ${vk===SELECTED_VARIANT?'active':''}" data-variant="${vk}">${getVariant(prog, vk).label}${empty?' (empty)':''}</span>`;
        }).join('') + `</div>` : ''}
      </div>
    </div>`;
  });
  html += `</div>`;

  const variant = getVariant(PROGRAMS[SELECTED_PROG], SELECTED_VARIANT);
  html += `<div class="section-label">${PROGRAMS[SELECTED_PROG].label} — ${variant.label}</div>`;
  if(variant.exercises.length===0){
    html += `<div class="empty">
      <p>This variant is empty. Add exercises to it from the Manage tab, then come back here to start it.</p>
    </div>`;
  } else {
    html += `<div class="card">`;
    variant.exercises.forEach(ex=>{
      html += `<div class="ex-row">
        <div class="ex-icon-wrap">${iconSvg(ex.pattern)}</div>
        <div class="ex-info">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-prescribed">${ex.sets} × ${ex.reps} ${ex.weight!==null && ex.weight!==undefined ? '× '+fmtWeight(ex.weight) : ''}</div>
        </div>
      </div>`;
    });
    html += `</div>
    <button class="btn" id="start-workout-btn">Start Workout</button>`;
  }

  view.innerHTML = html;

  view.querySelectorAll('.prog-card').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('.chip')) return;
      SELECTED_PROG = el.dataset.prog;
      SELECTED_VARIANT = 'main';
      renderToday();
    });
  });
  view.querySelectorAll('.chip[data-variant]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      SELECTED_VARIANT = el.dataset.variant;
      renderToday();
    });
  });
  const startBtn = document.getElementById('start-workout-btn');
  if(startBtn) startBtn.addEventListener('click', startWorkout);
}

function findLastPerformance(name){
  // HISTORY is newest-first; find the most recent session that logged this exact exercise name
  for(const h of HISTORY){
    const match = h.exercises.find(e=>e.name===name);
    if(match) return { weight: match.weight, reps: match.reps, date: h.date };
  }
  return null;
}

function startWorkout(){
  const variant = getVariant(PROGRAMS[SELECTED_PROG], SELECTED_VARIANT);
  ACTIVE_SESSION = {
    progKey: SELECTED_PROG,
    variantKey: SELECTED_VARIANT,
    startedAt: new Date().toISOString(),
    exercises: variant.exercises.map(ex=>{
      const last = findLastPerformance(ex.name);
      return {
        name: ex.name, pattern: ex.pattern, prescribedSets: ex.sets, prescribedReps: ex.reps, prescribedWeight: ex.weight,
        lastWeight: last ? last.weight : null, lastReps: last ? last.reps : null, lastDate: last ? last.date : null,
        doneSets: new Array(ex.sets).fill(false),
        actualWeight: last ? last.weight : ex.weight,
        actualReps: last ? last.reps : ex.reps,
        rpe: null
      };
    })
  };
  saveActiveSession();
  renderToday();
}

function renderActiveSession(){
  const s = ACTIVE_SESSION;
  const prog = PROGRAMS[s.progKey];
  let html = `<div class="section-label">${prog.label} — ${getVariant(prog, s.variantKey).label} · in progress</div>`;
  html += `<div class="card">`;
  s.exercises.forEach((ex, i)=>{
    html += `<div class="ex-row">
      <div class="ex-icon-wrap">${iconSvg(ex.pattern)}</div>
      <div class="ex-info">
        <div class="ex-name">${ex.name}${ex.addedThisSession ? ' <span style="color:var(--accent-2); font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.4px">· today only</span>' : ''}</div>
        <div class="ex-prescribed">${ex.lastWeight!==null || ex.lastReps!==null ? `Last time: ${ex.lastReps} × ${fmtWeight(ex.lastWeight)} <span style="color:var(--text-faint)">(${fmtDate(ex.lastDate)})</span>` : `Target: ${ex.prescribedSets} × ${ex.prescribedReps} ${ex.prescribedWeight!==null?'× '+fmtWeight(ex.prescribedWeight):''}`}</div>
        <div class="set-dots">${ex.doneSets.map((d,si)=>`<div class="set-dot ${d?'done':''}" data-ex="${i}" data-set="${si}">${si+1}</div>`).join('')}</div>
        <div class="field-row">
          <div class="field"><label>Weight</label><input type="number" step="0.5" inputmode="decimal" data-ex="${i}" data-field="actualWeight" value="${ex.actualWeight===null?'':ex.actualWeight}" placeholder="BW"></div>
          <div class="field"><label>Reps</label><input type="number" inputmode="numeric" data-ex="${i}" data-field="actualReps" value="${ex.actualReps}"></div>
          <div class="field"><label>RPE (1-5)</label><input type="number" min="1" max="5" inputmode="numeric" data-ex="${i}" data-field="rpe" value="${ex.rpe===null?'':ex.rpe}" placeholder="—"></div>
        </div>
      </div>
      <span class="icon-x" data-remove-session-ex="${i}" style="padding:4px 8px; font-size:18px; cursor:pointer">✕</span>
    </div>`;
  });
  html += `</div>
    <button class="btn ghost" id="add-session-ex-btn">+ Add exercise for today</button>
    <div style="height:8px"></div>
    <button class="btn" id="finish-workout-btn">Finish &amp; Save Workout</button>
    <button class="btn ghost" id="cancel-workout-btn" style="margin-top:8px">Cancel Workout</button>`;
  return html;
}

function bindActiveSessionEvents(){
  const view = document.getElementById('view-today');
  view.querySelectorAll('.set-dot').forEach(el=>{
    el.addEventListener('click', ()=>{
      const exi = +el.dataset.ex, si = +el.dataset.set;
      const ex = ACTIVE_SESSION.exercises[exi];
      ex.doneSets[si] = !ex.doneSets[si];
      saveActiveSession();
      renderToday();
    });
  });
  view.querySelectorAll('input[data-field]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const exi = +el.dataset.ex, field = el.dataset.field;
      let val = el.value === '' ? null : parseFloat(el.value);
      ACTIVE_SESSION.exercises[exi][field] = val;
      saveActiveSession();
    });
  });
  const finishBtn = document.getElementById('finish-workout-btn');
  if(finishBtn) finishBtn.addEventListener('click', finishWorkout);
  const cancelBtn = document.getElementById('cancel-workout-btn');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{
    if(confirm('Discard this in-progress workout?')){
      clearActiveSession();
      renderToday();
    }
  });
  const addExBtn = document.getElementById('add-session-ex-btn');
  if(addExBtn) addExBtn.addEventListener('click', openAddSessionExerciseModal);
  view.querySelectorAll('[data-remove-session-ex]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const i = +el.dataset.removeSessionEx;
      ACTIVE_SESSION.exercises.splice(i,1);
      saveActiveSession();
      renderToday();
    });
  });
}

function openAddSessionExerciseModal(){
  const patternOptions = ['press_horizontal','press_incline','press_vertical','row_horizontal','pulldown','pullup','hinge','squat','lunge','curl','triceps_extension','raise_lateral','fly','shrug','calf','core','adduction','leg_extension','bodyweight','hipthrust'];
  // Offer a quick pick from the exercise library, or a custom name
  const lib = fullLibrary();
  openModal(`
    <span class="close-x" id="modal-close">✕</span>
    <h3>Add Exercise — Today Only</h3>
    <div class="field"><label>Pick from library (optional)</label>
      <select id="m-lib-pick" class="plain" style="width:100%">
        <option value="">— custom —</option>
        ${lib.map(e=>`<option value="${e.name}">${e.name}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Name</label><input id="m-name" placeholder="e.g. Cable Fly"></div>
    <div class="field-row">
      <div class="field"><label>Sets</label><input id="m-sets" type="number" value="3"></div>
      <div class="field"><label>Reps</label><input id="m-reps" type="number" value="10"></div>
      <div class="field"><label>Weight (blank = BW)</label><input id="m-weight" type="number" step="0.5"></div>
    </div>
    <div class="field"><label>Icon</label>
      <select id="m-pattern" class="plain" style="width:100%">${patternOptions.map(p=>`<option value="${p}">${p.replace('_',' ')}</option>`).join('')}</select>
    </div>
    <div style="color:var(--text-faint); font-size:12px; margin-top:10px">This only affects today's workout — your saved program templates won't change.</div>
    <button class="btn" id="m-save" style="margin-top:14px">Add to Today's Workout</button>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('m-lib-pick').addEventListener('change', (e)=>{
    const picked = lib.find(x=>x.name===e.target.value);
    if(picked){
      document.getElementById('m-name').value = picked.name;
      document.getElementById('m-pattern').value = picked.pattern;
      const last = findLastPerformance(picked.name);
      if(last){
        document.getElementById('m-weight').value = last.weight===null ? '' : last.weight;
        document.getElementById('m-reps').value = last.reps;
      }
    }
  });
  document.getElementById('m-save').addEventListener('click', ()=>{
    const name = document.getElementById('m-name').value.trim();
    if(!name){ toast('Enter a name'); return; }
    const sets = parseInt(document.getElementById('m-sets').value)||3;
    const reps = parseInt(document.getElementById('m-reps').value)||10;
    const wRaw = document.getElementById('m-weight').value;
    const weight = wRaw==='' ? null : parseFloat(wRaw);
    const pattern = document.getElementById('m-pattern').value;
    const last = findLastPerformance(name);
    ACTIVE_SESSION.exercises.push({
      name, pattern, prescribedSets: sets, prescribedReps: reps, prescribedWeight: weight,
      lastWeight: last ? last.weight : null, lastReps: last ? last.reps : null, lastDate: last ? last.date : null,
      doneSets: new Array(sets).fill(false),
      actualWeight: last ? last.weight : weight, actualReps: last ? last.reps : reps, rpe: null,
      addedThisSession: true
    });
    saveActiveSession();
    closeModal();
    renderToday();
    toast("Added to today's workout");
  });
}

function finishWorkout(){
  const s = ACTIVE_SESSION;
  const entry = {
    id: 'h_'+Date.now(),
    date: new Date().toISOString(),
    progKey: s.progKey,
    progLabel: PROGRAMS[s.progKey].label,
    variantKey: s.variantKey,
    variantLabel: getVariant(PROGRAMS[s.progKey], s.variantKey).label,
    exercises: s.exercises.map(ex=>({
      name: ex.name, weight: ex.actualWeight, reps: ex.actualReps, rpe: ex.rpe,
      setsCompleted: ex.doneSets.filter(Boolean).length, setsPrescribed: ex.prescribedSets
    }))
  };
  HISTORY.unshift(entry);
  saveHistory();
  clearActiveSession();
  toast('Workout saved');
  renderToday();
}

/* ============================= HISTORY VIEW ============================= */

function renderHistory(){
  const view = document.getElementById('view-history');
  if(HISTORY.length===0){
    view.innerHTML = `<div class="empty"><p>No workouts logged yet. Finish a session from the Today tab and it'll show up here.</p></div>`;
    return;
  }
  let html = `<div class="section-label">Sessions</div><div class="card">`;
  HISTORY.forEach(h=>{
    html += `<div class="hist-item" data-id="${h.id}">
      <div class="hist-top">
        <div>
          <div class="hist-date">${fmtDate(h.date)}</div>
          <div class="hist-prog">${h.progLabel} · ${h.variantLabel}</div>
        </div>
        <div style="color:var(--text-faint); font-size:12px">${h.exercises.length} ex</div>
      </div>
      <div class="hist-detail">
        ${h.exercises.map(e=>`${e.name}: ${e.setsCompleted}/${e.setsPrescribed} sets · ${e.reps ?? '—'} reps × ${fmtWeight(e.weight)}${e.rpe?' · RPE '+e.rpe:''}`).join('<br>')}
      </div>
    </div>`;
  });
  html += `</div>`;

  html += `<div class="section-label">Progress by exercise</div>`;
  const exNames = [...new Set(HISTORY.flatMap(h=>h.exercises.map(e=>e.name)))];
  if(exNames.length){
    html += `<div class="card"><div class="field"><label>Exercise</label>
      <select class="plain" id="progress-select" style="width:100%">
        ${exNames.map(n=>`<option value="${n}">${n}</option>`).join('')}
      </select></div>
      <div id="progress-chart" class="sparkline-wrap"></div>
    </div>`;
  }

  view.innerHTML = html;

  view.querySelectorAll('.hist-item').forEach(el=>{
    el.addEventListener('click', ()=> el.classList.toggle('open'));
  });
  const sel = document.getElementById('progress-select');
  if(sel){
    sel.addEventListener('change', ()=> renderProgressChart(sel.value));
    renderProgressChart(sel.value);
  }
}

function renderProgressChart(exName){
  const points = HISTORY.slice().reverse()
    .flatMap(h=> h.exercises.filter(e=>e.name===exName && e.weight!==null).map(e=>({date:h.date, weight:e.weight})));
  const el = document.getElementById('progress-chart');
  if(!el) return;
  if(points.length < 2){
    el.innerHTML = `<div style="color:var(--text-faint); font-size:12.5px; padding:8px 0">Log this exercise a couple more times to see a trend line.</div>`;
    return;
  }
  const w = 500, h = 90, pad = 10;
  const ws = points.map(p=>p.weight);
  const min = Math.min(...ws), max = Math.max(...ws);
  const range = (max-min) || 1;
  const step = (w - pad*2) / (points.length-1);
  const coords = points.map((p,i)=>{
    const x = pad + i*step;
    const y = pad + (1 - (p.weight-min)/range) * (h - pad*2);
    return [x,y];
  });
  const path = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const dots = coords.map(c=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3" fill="var(--accent)"/>`).join('');
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:90px;">
    <path d="${path}" stroke="var(--accent)" stroke-width="2" fill="none"/>
    ${dots}
  </svg>
  <div style="display:flex; justify-content:space-between; color:var(--text-faint); font-size:11px; font-family:var(--font-mono)">
    <span>${fmtWeight(min)}</span><span>${fmtWeight(max)}</span>
  </div>`;
}

/* ============================= LIBRARY VIEW ============================= */

let LIB_FILTER = 'All';
let LIB_SEARCH = '';

function renderLibrary(){
  const view = document.getElementById('view-library');
  const lib = fullLibrary();
  const cats = ['All', ...new Set(lib.map(e=>e.cat))];

  let html = `<input class="search-bar" id="lib-search" placeholder="Search exercises…" value="${LIB_SEARCH}">
  <div class="filter-row">${cats.map(c=>`<span class="chip ${c===LIB_FILTER?'active':''}" data-cat="${c}">${c}</span>`).join('')}</div>
  <div class="card">`;

  const filtered = lib.filter(e=>{
    const matchesCat = LIB_FILTER==='All' || e.cat===LIB_FILTER;
    const matchesSearch = !LIB_SEARCH || e.name.toLowerCase().includes(LIB_SEARCH.toLowerCase()) || e.muscles.toLowerCase().includes(LIB_SEARCH.toLowerCase());
    return matchesCat && matchesSearch;
  });

  if(filtered.length===0){
    html += `<div class="empty"><p>No exercises match. Try a different search or add one from Manage.</p></div>`;
  } else {
    filtered.forEach(e=>{
      html += `<div class="lib-row-wrap" data-name="${e.name}">
        <div class="lib-row">
          <div class="ex-icon-wrap">${iconSvg(e.pattern)}</div>
          <div class="ex-info">
            <div class="lib-name">${e.name}</div>
            <div class="lib-muscles">${e.muscles} · ${EQUIP_LABEL[e.equip]||e.equip}</div>
          </div>
        </div>
        <div class="lib-detail">${e.cue}</div>
      </div>`;
    });
  }
  html += `</div>`;
  view.innerHTML = html;

  document.getElementById('lib-search').addEventListener('input', (e)=>{
    LIB_SEARCH = e.target.value; renderLibrary();
    document.getElementById('lib-search').focus();
    document.getElementById('lib-search').selectionStart = document.getElementById('lib-search').value.length;
  });
  view.querySelectorAll('.chip[data-cat]').forEach(el=>{
    el.addEventListener('click', ()=>{ LIB_FILTER = el.dataset.cat; renderLibrary(); });
  });
  view.querySelectorAll('.lib-row-wrap').forEach(el=>{
    el.addEventListener('click', ()=> el.classList.toggle('open'));
  });
}

/* ============================= MANAGE VIEW ============================= */

function renderManage(){
  const view = document.getElementById('view-manage');
  let html = `<div class="section-label">Edit programs</div>`;

  Object.keys(PROGRAMS).sort((a,b)=>PROGRAMS[a].order-PROGRAMS[b].order).forEach(pk=>{
    const prog = PROGRAMS[pk];
    html += `<div class="card">
      <div class="ex-name" style="margin-bottom:8px">${prog.label}</div>`;
    Object.keys(prog.variants).forEach(vk=>{
      const variant = prog.variants[vk];
      html += `<div style="margin-bottom:10px">
        <div style="display:flex; justify-content:space-between; align-items:center">
          <span style="color:var(--text-dim); font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.5px">${variant.label}</span>
          <span class="btn small ghost" data-add-ex="${pk}:${vk}">+ Add exercise</span>
        </div>`;
      if(variant.exercises.length===0){
        html += `<div style="color:var(--text-faint); font-size:12.5px; padding:8px 0">No exercises yet.</div>`;
      } else {
        html += `<div class="manage-list">`;
        variant.exercises.forEach((ex,i)=>{
          html += `<div class="ex-row">
            <div class="ex-icon-wrap">${iconSvg(ex.pattern)}</div>
            <div class="ex-info">
              <div class="ex-name">${ex.name}</div>
              <div class="ex-prescribed">${ex.sets} × ${ex.reps} ${ex.weight!==null?'× '+fmtWeight(ex.weight):''}</div>
            </div>
            <span class="icon-x" data-remove-ex="${pk}:${vk}:${i}" style="padding:4px 8px; font-size:18px; cursor:pointer">✕</span>
          </div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
    });
    html += `</div>`;
  });

  html += `<div class="section-label">Account</div>
  <div class="card">
    ${CURRENT_USER
      ? `<div style="margin-bottom:10px; font-size:13.5px; color:var(--text-dim)">Signed in as <strong style="color:var(--text)">${CURRENT_USER.email}</strong><br>Syncing across your devices.</div>
         <button class="btn ghost" id="signout-btn">Sign Out</button>`
      : FIREBASE_READY
        ? `<div style="margin-bottom:10px; font-size:13.5px; color:var(--text-dim)">Not signed in. Your data is only stored on this device.</div>
           <button class="btn" id="signin-again-btn">Sign In / Sync</button>`
        : `<div style="font-size:13.5px; color:var(--text-dim)">Cloud sync isn't configured on this copy of the app yet.</div>`
    }
  </div>

  <div class="section-label">Backup</div>
  <div class="card">
    <button class="btn ghost" id="export-btn">Export JSON</button>
    <div style="height:8px"></div>
    <button class="btn ghost" id="import-btn">Import JSON</button>
    <textarea class="jsonbox" id="import-box" placeholder="Paste exported JSON here, then tap Import JSON" style="margin-top:8px"></textarea>
  </div>

  <div class="section-label">Reset</div>
  <div class="card">
    <button class="btn danger" id="reset-btn">Reset all data</button>
  </div>`;

  view.innerHTML = html;

  view.querySelectorAll('[data-add-ex]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [pk,vk] = el.dataset.addEx.split(':');
      openAddExerciseModal(pk,vk);
    });
  });
  view.querySelectorAll('[data-remove-ex]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [pk,vk,i] = el.dataset.removeEx.split(':');
      PROGRAMS[pk].variants[vk].exercises.splice(+i,1);
      savePrograms();
      renderManage();
    });
  });
  document.getElementById('export-btn').addEventListener('click', doExport);
  document.getElementById('import-btn').addEventListener('click', doImport);
  document.getElementById('reset-btn').addEventListener('click', doReset);
  const signoutBtn = document.getElementById('signout-btn');
  if(signoutBtn) signoutBtn.addEventListener('click', ()=>{ signOutCloud(); renderManage(); });
  const signinAgainBtn = document.getElementById('signin-again-btn');
  if(signinAgainBtn) signinAgainBtn.addEventListener('click', ()=>{ localStorage.removeItem(LS_AUTH_SKIPPED); showAuthGate(); });
}

function openAddExerciseModal(pk, vk){
  const patternOptions = ['press_horizontal','press_incline','press_vertical','row_horizontal','pulldown','pullup','hinge','squat','lunge','curl','triceps_extension','raise_lateral','fly','shrug','calf','core','adduction','leg_extension','bodyweight','hipthrust'];
  openModal(`
    <span class="close-x" id="modal-close">✕</span>
    <h3>Add Exercise</h3>
    <div class="field"><label>Name</label><input id="m-name" placeholder="e.g. Cable Fly"></div>
    <div class="field-row">
      <div class="field"><label>Sets</label><input id="m-sets" type="number" value="3"></div>
      <div class="field"><label>Reps</label><input id="m-reps" type="number" value="10"></div>
      <div class="field"><label>Weight (blank = BW)</label><input id="m-weight" type="number" step="0.5"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Equipment</label>
        <select id="m-equip" class="plain" style="width:100%">${Object.keys(EQUIP_LABEL).map(k=>`<option value="${k}">${EQUIP_LABEL[k]}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Icon</label>
        <select id="m-pattern" class="plain" style="width:100%">${patternOptions.map(p=>`<option value="${p}">${p.replace('_',' ')}</option>`).join('')}</select>
      </div>
    </div>
    <button class="btn" id="m-save" style="margin-top:14px">Add to ${PROGRAMS[pk].variants[vk].label}</button>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('m-save').addEventListener('click', ()=>{
    const name = document.getElementById('m-name').value.trim();
    if(!name){ toast('Enter a name'); return; }
    const sets = parseInt(document.getElementById('m-sets').value)||3;
    const reps = parseInt(document.getElementById('m-reps').value)||10;
    const wRaw = document.getElementById('m-weight').value;
    const weight = wRaw==='' ? null : parseFloat(wRaw);
    const equip = document.getElementById('m-equip').value;
    const pattern = document.getElementById('m-pattern').value;
    PROGRAMS[pk].variants[vk].exercises.push({name, equip, pattern, sets, reps, weight});
    savePrograms();
    closeModal();
    renderManage();
    toast('Exercise added');
  });
}

function doExport(){
  const payload = { programs: PROGRAMS, history: HISTORY, customLibrary: CUSTOM_LIBRARY, exportedAt: new Date().toISOString() };
  const json = JSON.stringify(payload, null, 2);
  const box = document.getElementById('import-box');
  box.value = json;
  if(navigator.share){
    // best effort, ignore failure silently
  }
  // Also trigger a download
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'iron-log-backup.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Exported — JSON also shown below to copy');
}

function doImport(){
  const box = document.getElementById('import-box');
  try{
    const data = JSON.parse(box.value);
    if(data.programs) PROGRAMS = data.programs;
    if(data.history) HISTORY = data.history;
    if(data.customLibrary) CUSTOM_LIBRARY = data.customLibrary;
    savePrograms(); saveHistory(); saveCustomLibrary();
    toast('Import successful');
    renderManage();
  }catch(e){
    toast('Invalid JSON');
  }
}

function doReset(){
  if(!confirm('This clears all workouts, custom exercises, and edits. Continue?')) return;
  localStorage.removeItem(LS_PROGRAMS);
  localStorage.removeItem(LS_HISTORY);
  localStorage.removeItem(LS_LIBRARY);
  localStorage.removeItem(LS_SESSION);
  PROGRAMS = loadPrograms(); HISTORY = []; CUSTOM_LIBRARY = []; ACTIVE_SESSION = null;
  toast('Reset complete');
  showTab('today');
}

/* ============================= INIT ============================= */

renderToday();
initFirebase();
</script>
